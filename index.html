  <main id="top">
    <!-- HERO -->
    <section class="hero">
      <canvas class="hero-canvas" aria-hidden="true"></canvas>

      <div class="hero-inner container">
        <h1 class="hero-name" data-name>Sandi Warjri</h1>
        <p class="hero-tagline intro" style="--d:550ms" data-tagline></p>
        <div class="hero-cta intro" style="--d:700ms">
          <a class="btn btn-primary magnetic" href="#projects">See my work <span class="arrow" aria-hidden="true">→</span></a>
          <a class="btn btn-ghost magnetic" href="#info">Say hi</a>
        </div>
      </div>

      <a class="scroll-cue" href="#projects" aria-label="Scroll to projects"><span></span></a>
    </section>

    <!-- TECH TICKER -->
    <div class="marquee" data-marquee>
      <div class="marquee-track" aria-hidden="true" data-stack></div>
    </div>

    <!-- PROJECTS -->
    <section id="projects" class="section container">
      <header class="section-head reveal">
        <p class="kicker mono">01 — Work</p>
        <h2>Things I've built</h2>
      </header>
      <div class="filters reveal" role="group" aria-label="Filter projects" data-filters></div>
      <div class="grid" data-projects></div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="section container">
      <header class="section-head reveal">
        <p class="kicker mono">02 — About</p>
        <h2>What's up dog?</h2>
      </header>
      <div class="about-grid" data-about-grid>
        <div class="about-text reveal" data-about></div>
        <aside class="about-side">
          <div class="stats" data-stats></div>
          <div class="now reveal" style="--d:200ms">
            <p class="mono now-title">// right now</p>
            <ul data-now></ul>
          </div>
          <a class="text-link reveal" href="/albums">I'm always listening <span class="arrow" aria-hidden="true">→</span></a>
        </aside>
      </div>
    </section>

    <!-- INFO (contact) -->
    <section id="info" class="section container contact">
      <p class="kicker mono reveal">03 — Info</p>
      <h2 class="contact-title reveal">Let's <br /><span class="gradient-text">connect!</span></h2>
      <div class="contact-card reveal" data-email-block>
        <a class="email-link" data-email href="#"></a>
        <button class="btn btn-ghost btn-sm magnetic" type="button" data-copy>Copy</button>
      </div>
      <div class="socials reveal" data-socials></div>
